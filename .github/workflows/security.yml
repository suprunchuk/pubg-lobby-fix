name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

  gosec:
    name: gosec
    # Analyze with GOOS=windows on Linux so SARIF paths are file:// (Windows drive
    # letters like d:\ break code-scanning upload).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        env:
          GOOS: windows
          GOARCH: amd64
        run: gosec -no-fail -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  codeql:
    name: CodeQL
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  bearer:
    name: Bearer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Bearer Security Scan
        uses: bearer/bearer-action@v2
        with:
          format: sarif
          output: bearer-results.sarif
          # WinAPI code uses unsafe.Pointer intentionally; report to Security tab, don't fail CI
          exit-code: "0"
          skip-path: ".agents,LEGACY_DOT_NET"

      - name: Upload Bearer results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bearer-results.sarif
          category: bearer

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    # Windows-only codebase (iphlpapi / user32 via *_windows.go)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.26"
          - "stable"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -o pubg-lobby-fix.exe .

      # -race needs a C compiler (CGO). windows-latest has no gcc by default;
      # installing MinGW just for race slows CI a lot for this small tool.
      - name: Run tests
        shell: bash
        run: go test -v -shuffle=on -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
